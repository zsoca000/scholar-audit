[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lit-pipeline"
version = "0.1.0"
description = "Automated Research Intelligence & Literature Pipeline using OpenAlex and LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pandas>=2.2.0",
    "duckdb>=1.0.0",
    "pyyaml>=6.0.1",
    "bibtexparser>=1.4.0,<2.0.0",
    "tqdm>=4.66.0",
    "pypdf>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
lit-pipeline = "src.main:cli"
